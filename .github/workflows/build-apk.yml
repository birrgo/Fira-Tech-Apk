name: Convert PWA to Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node Dependencies & Esbuild
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/splash-screen capacitor-admob-nextgen esbuild

      - name: Enable NextGen Native Ads in package.json
        run: |
          node -e "const fs = require('fs'); let pkg = JSON.parse(fs.readFileSync('package.json')); pkg.admob = { enableNativeAds: true }; fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));"

      - name: Bundle Web Files & Compile Native Bridge
        run: |
          mkdir www
          # Copy all web files except dev files
          rsync -av --exclude='.git' --exclude='.github' --exclude='www' --exclude='node_modules' ./ www/
          
          # Create a Javascript Bridge to connect HTML to the Android App
          echo "import { Capacitor } from '@capacitor/core';" > bridge.js
          echo "import { AdMobNextGen } from 'capacitor-admob-nextgen';" >> bridge.js
          echo "window.Capacitor = Capacitor;" >> bridge.js
          echo "window.AdMobPlugin = AdMobNextGen;" >> bridge.js
          
          # Compile the bridge into the www folder
          npx esbuild bridge.js --bundle --minify --outfile=www/native-bridge.js

      - name: Create Capacitor Config Safely
        run: |
          echo '{' > capacitor.config.json
          echo '  "appId": "com.firatech.app",' >> capacitor.config.json
          echo '  "appName": "Fira Tech",' >> capacitor.config.json
          echo '  "webDir": "www",' >> capacitor.config.json
          echo '  "bundledWebRuntime": false,' >> capacitor.config.json
          echo '  "plugins": {' >> capacitor.config.json
          echo '    "SplashScreen": {' >> capacitor.config.json
          echo '      "launchShowDuration": 3000,' >> capacitor.config.json
          echo '      "launchAutoHide": true,' >> capacitor.config.json
          echo '      "backgroundColor": "#001a66",' >> capacitor.config.json
          echo '      "androidSplashResourceName": "splash",' >> capacitor.config.json
          echo '      "androidScaleType": "CENTER_CROP",' >> capacitor.config.json
          echo '      "splashFullScreen": true,' >> capacitor.config.json
          echo '      "splashImmersive": true,' >> capacitor.config.json
          echo '      "showSpinner": false' >> capacitor.config.json
          echo '    }' >> capacitor.config.json
          echo '  }' >> capacitor.config.json
          echo '}' >> capacitor.config.json

      - name: Initialize & Sync Android Project
        run: |
          npx cap add android
          npx cap sync android

      - name: Inject Official AdMob Test App ID into AndroidManifest.xml
        run: |
          node -e "
          const fs = require('fs');
          const file = 'android/app/src/main/AndroidManifest.xml';
          let manifest = fs.readFileSync(file, 'utf8');
          const metaTag = '        <meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"ca-app-pub-3940256099942544~3347511713\"/>\n';
          manifest = manifest.replace('</application>', metaTag + '    </application>');
          fs.writeFileSync(file, manifest);
          "

      - name: Target API Level 36 and MinSdk 24 (Fix Build Error)
        run: |
          if [ -f android/variables.gradle ]; then
            sed -i 's/targetSdkVersion = .*/targetSdkVersion = 36/' android/variables.gradle
            sed -i 's/compileSdkVersion = .*/compileSdkVersion = 36/' android/variables.gradle
            sed -i 's/minSdkVersion = .*/minSdkVersion = 24/' android/variables.gradle
          fi
          sed -i 's/targetSdkVersion .*/targetSdkVersion 36/' android/app/build.gradle
          sed -i 's/compileSdkVersion .*/compileSdkVersion 36/' android/app/build.gradle
          sed -i 's/minSdk .*/minSdk 24/' android/app/build.gradle
          sed -i 's/minSdkVersion .*/minSdkVersion 24/' android/app/build.gradle

      - name: Set Dynamic Version Code
        run: |
          sed -i 's/versionCode 1/versionCode ${{ github.run_number }}/' android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "1.0.${{ github.run_number }}"/' android/app/build.gradle

      - name: Fix Android Hardware Back Button
        run: |
          mkdir -p android/app/src/main/java/com/firatech/app
          cat << 'EOF' > android/app/src/main/java/com/firatech/app/MainActivity.java
          package com.firatech.app;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onBackPressed() {
                  if (this.bridge != null && this.bridge.getWebView() != null && this.bridge.getWebView().canGoBack()) {
                      this.bridge.getWebView().goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Setup App Icon
        run: |
          if [ -f s.png ]; then
            rm -rf android/app/src/main/res/mipmap-anydpi-v26
            find android/app/src/main/res -name "ic_launcher*.xml" -type f -delete
            for dir in android/app/src/main/res/mipmap-*/; do
              cp -f s.png "${dir}ic_launcher.png" 2>/dev/null || true
              cp -f s.png "${dir}ic_launcher_round.png" 2>/dev/null || true
            done
          fi

      - name: Fix Kotlin Clashes
        run: |
          echo "" >> android/app/build.gradle
          echo "configurations.all {" >> android/app/build.gradle
          echo "    resolutionStrategy {" >> android/app/build.gradle
          echo "        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'" >> android/app/build.gradle
          echo "        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'" >> android/app/build.gradle
          echo "        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'" >> android/app/build.gradle
          echo "    }" >> android/app/build.gradle
          echo "}" >> android/app/build.gradle

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Build Installable Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Move & Rename APK Output
        run: mv android/app/build/outputs/apk/debug/app-debug.apk fira-tech.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fira-tech-apk
          path: fira-tech.apk
