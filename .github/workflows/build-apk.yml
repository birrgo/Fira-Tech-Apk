name: Convert PWA to Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  APP_NAME: "Fira Tech"
  PACKAGE_NAME: "com.firatech.app"
  ADMOB_APP_ID: "ca-app-pub-3940256099942544~3347511713"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies & Esbuild
        run: |
          if [ ! -f package.json ]; then npm init -y; fi
          npm install @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8 @capacitor/splash-screen@8 @capacitor/network@8 capacitor-admob-nextgen@1.2.9 esbuild

      - name: Initialize AdMob SDK Variables
        run: |
          node -e "
          const fs = require('fs');
          let pkg = JSON.parse(fs.readFileSync('package.json'));
          pkg.admob = {
            androidAppId: '${{ env.ADMOB_APP_ID }}',
            enableNativeAds: { android: true } 
          };
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "

      - name: Bundle Web Files & Compile Native Bridge
        run: |
          rm -rf www
          mkdir -p www
          rsync -av --exclude='.git' --exclude='.github' --exclude='www' --exclude='node_modules' ./ www/
          
          # Injecting Centered Offline Popup logic with Try Again button
          cat << 'EOF' > bridge.js
          import { Capacitor } from '@capacitor/core';
          import { AdMobNextGen } from 'capacitor-admob-nextgen';
          import { Network } from '@capacitor/network';
          
          window.Capacitor = Capacitor;
          window.AdMobPlugin = AdMobNextGen;
          window.Network = Network;

          const handleNetwork = (status) => {
            let popup = document.getElementById('offline-popup');
            
            if (!status.connected) {
              if (!popup) {
                // Create fullscreen dark overlay
                popup = document.createElement('div');
                popup.id = 'offline-popup';
                popup.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:999999;backdrop-filter:blur(3px);';
                
                // Create centered white box
                const box = document.createElement('div');
                box.style.cssText = 'background:white;padding:25px;border-radius:12px;text-align:center;width:80%;max-width:320px;font-family:sans-serif;box-shadow:0 4px 15px rgba(0,0,0,0.3);';
                
                // Warning Icon
                const icon = document.createElement('div');
                icon.innerHTML = '⚠️';
                icon.style.cssText = 'font-size:40px;margin-bottom:15px;';
                
                // Title text
                const title = document.createElement('h3');
                title.innerText = 'No Internet Connection';
                title.style.cssText = 'margin:0 0 10px 0;color:#222;font-size:18px;';
                
                // Subtitle text
                const text = document.createElement('p');
                text.innerText = 'Please check your network settings and try again.';
                text.style.cssText = 'margin:0 0 20px 0;color:#666;font-size:14px;line-height:1.4;';
                
                // Try Again Button
                const btn = document.createElement('button');
                btn.innerText = 'Try Again';
                btn.style.cssText = 'background:#001a66;color:white;border:none;padding:12px 24px;border-radius:8px;font-size:15px;cursor:pointer;font-weight:bold;width:100%;text-transform:uppercase;';
                
                // Button Click Logic
                btn.onclick = async () => {
                  btn.innerText = 'Checking...';
                  btn.style.opacity = '0.7';
                  
                  const currentStatus = await Network.getStatus();
                  
                  if (currentStatus.connected) {
                    popup.remove();
                    window.location.reload(); // Reload the app to fetch fresh data
                  } else {
                    setTimeout(() => {
                      btn.innerText = 'Try Again';
                      btn.style.opacity = '1';
                    }, 500); // Small delay so the user sees the button was pressed
                  }
                };
                
                // Assemble the popup
                box.appendChild(icon);
                box.appendChild(title);
                box.appendChild(text);
                box.appendChild(btn);
                popup.appendChild(box);
                document.body.appendChild(popup);
              }
            } else if (popup) {
              // If connected and popup exists, remove it
              popup.remove();
            }
          };

          // Listen for network changes automatically
          Network.addListener('networkStatusChange', handleNetwork);
          
          // Check status immediately on app load
          Network.getStatus().then(handleNetwork);
          EOF
          
          npx esbuild bridge.js --bundle --minify --outfile=www/native-bridge.js

      - name: Create Capacitor Config
        run: |
          echo '{' > capacitor.config.json
          echo '  "appId": "${{ env.PACKAGE_NAME }}",' >> capacitor.config.json
          echo '  "appName": "${{ env.APP_NAME }}",' >> capacitor.config.json
          echo '  "webDir": "www",' >> capacitor.config.json
          echo '  "bundledWebRuntime": false,' >> capacitor.config.json
          echo '  "plugins": {' >> capacitor.config.json
          echo '    "SplashScreen": {' >> capacitor.config.json
          echo '      "launchShowDuration": 3000,' >> capacitor.config.json
          echo '      "launchAutoHide": true,' >> capacitor.config.json
          echo '      "backgroundColor": "#001a66",' >> capacitor.config.json
          echo '      "androidSplashResourceName": "splash",' >> capacitor.config.json
          echo '      "androidScaleType": "CENTER_CROP",' >> capacitor.config.json
          echo '      "splashFullScreen": true,' >> capacitor.config.json
          echo '      "splashImmersive": true,' >> capacitor.config.json
          echo '      "showSpinner": false' >> capacitor.config.json
          echo '    }' >> capacitor.config.json
          echo '  }' >> capacitor.config.json
          echo '}' >> capacitor.config.json

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Initialize & Sync Android Project
        run: |
          npx cap add android
          npx cap sync android
          
          if [ -f node_modules/capacitor-admob-nextgen/scripts/admob-manifest.js ]; then
            node node_modules/capacitor-admob-nextgen/scripts/admob-manifest.js
          fi
          
          if [ -f node_modules/capacitor-admob-nextgen/scripts/admob-native.js ]; then
            node node_modules/capacitor-admob-nextgen/scripts/admob-native.js
          fi

      - name: Target Android SDK 36
        run: |
          if [ -f android/variables.gradle ]; then
            sed -i 's/targetSdkVersion = .*/targetSdkVersion = 36/' android/variables.gradle
            sed -i 's/compileSdkVersion = .*/compileSdkVersion = 36/' android/variables.gradle
            sed -i 's/minSdkVersion = .*/minSdkVersion = 24/' android/variables.gradle
          fi
          sed -i 's/targetSdkVersion .*/targetSdkVersion 36/' android/app/build.gradle
          sed -i 's/compileSdkVersion .*/compileSdkVersion 36/' android/app/build.gradle
          sed -i 's/minSdk .*/minSdk 24/' android/app/build.gradle
          sed -i 's/minSdkVersion .*/minSdkVersion 24/' android/app/build.gradle

      - name: Set Dynamic Version Code
        run: |
          sed -i 's/versionCode 1/versionCode ${{ github.run_number }}/' android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "1.0.${{ github.run_number }}"/' android/app/build.gradle

      - name: Fix Android Hardware Back Button
        run: |
          PACKAGE_PATH=$(echo "${{ env.PACKAGE_NAME }}" | tr '.' '/')
          mkdir -p android/app/src/main/java/$PACKAGE_PATH
          
          cat << EOF > android/app/src/main/java/$PACKAGE_PATH/MainActivity.java
          package ${{ env.PACKAGE_NAME }};

          import android.os.Bundle;
          import androidx.activity.OnBackPressedCallback;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  
                  getOnBackPressedDispatcher().addCallback(this, new OnBackPressedCallback(true) {
                      @Override
                      public void handleOnBackPressed() {
                          if (bridge != null && bridge.getWebView() != null && bridge.getWebView().canGoBack()) {
                              bridge.getWebView().goBack();
                          } else {
                              setEnabled(false);
                              getOnBackPressedDispatcher().onBackPressed();
                          }
                      }
                  });
              }
          }
          EOF

      - name: Setup App Icon
        run: |
          if [ -f s.png ]; then
            rm -rf android/app/src/main/res/mipmap-anydpi-v26
            find android/app/src/main/res -name "ic_launcher*.xml" -type f -delete
            for dir in android/app/src/main/res/mipmap-*/; do
              cp -f s.png "${dir}ic_launcher.png" 2>/dev/null || true
              cp -f s.png "${dir}ic_launcher_round.png" 2>/dev/null || true
            done
          fi

      - name: Build Installable Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Move & Rename APK Output
        run: mv android/app/build/outputs/apk/debug/app-debug.apk fira-tech.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fira-tech-apk
          path: fira-tech.apk
