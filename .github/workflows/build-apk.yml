name: Convert PWA to Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  APP_NAME: "Fira Tech"
  PACKAGE_NAME: "com.firatech.app"

  # Google official AdMob TEST App ID
  ADMOB_APP_ID: "ca-app-pub-3940256099942544~3347511713"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================
      - name: Checkout Code
        uses: actions/checkout@v4


      # =========================================================
      # 2. NODE.JS 22
      # Capacitor 8 requires Node 22+
      # =========================================================
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"


      # =========================================================
      # 3. CREATE PACKAGE.JSON AND INSTALL DEPENDENCIES
      # =========================================================
      - name: Install Dependencies
        shell: bash
        run: |
          set -e

          echo "Node:"
          node --version

          echo "NPM:"
          npm --version

          if [ ! -f package.json ]; then
            echo "Creating package.json..."
            npm init -y
          fi

          npm install \
            @capacitor/core@8 \
            @capacitor/cli@8 \
            @capacitor/android@8 \
            @capacitor/splash-screen@8 \
            capacitor-admob-nextgen@1.2.9 \
            cordova-plugin-admob-nextgen \
            cordova-plugin-admob-nextgen-native \
            esbuild

          echo ""
          echo "Dependencies installed successfully."


      # =========================================================
      # 4. CONFIGURE ADMOB TEST APP ID
      # =========================================================
      - name: Configure AdMob Test App
        shell: bash
        run: |
          set -e

          node <<'NODE'
          const fs = require("fs");

          const file = "package.json";
          const pkg = JSON.parse(fs.readFileSync(file, "utf8"));

          pkg.admob = {
            androidAppId: process.env.ADMOB_APP_ID,
            enableNativeAds: {
              android: true
            }
          };

          pkg.scripts = pkg.scripts || {};

          pkg.scripts["capacitor:sync:after"] =
            "node node_modules/capacitor-admob-nextgen/scripts/admob-manifest.js && node node_modules/capacitor-admob-nextgen/scripts/admob-native.js";

          fs.writeFileSync(
            file,
            JSON.stringify(pkg, null, 2) + "\n"
          );

          console.log("AdMob configuration created.");
          NODE

          echo ""
          echo "AdMob TEST App ID:"
          echo "${ADMOB_APP_ID}"


      # =========================================================
      # 5. PREPARE WWW
      # =========================================================
      - name: Prepare Web Files
        shell: bash
        run: |
          set -e

          rm -rf www
          mkdir -p www

          rsync -av \
            --exclude=".git" \
            --exclude=".github" \
            --exclude="www" \
            --exclude="android" \
            --exclude="node_modules" \
            --exclude="package.json" \
            --exclude="package-lock.json" \
            ./ www/

          echo ""
          echo "Files copied into www:" 
          find www -maxdepth 2 -type f | sort

          if [ ! -f www/index.html ]; then
            echo ""
            echo "ERROR: index.html was not found."
            exit 1
          fi

          echo ""
          echo "index.html found."


      # =========================================================
      # 6. CREATE JAVASCRIPT ADMOB BRIDGE
      # =========================================================
      - name: Create Native JavaScript Bridge
        shell: bash
        run: |
          set -e

          cat > bridge.js <<'EOF'
          import { Capacitor } from '@capacitor/core';
          import { AdMobNextGen } from 'capacitor-admob-nextgen';

          window.Capacitor = Capacitor;
          window.AdMobPlugin = AdMobNextGen;
          EOF

          npx esbuild \
            bridge.js \
            --bundle \
            --minify \
            --outfile=www/native-bridge.js

          if [ ! -f www/native-bridge.js ]; then
            echo "ERROR: native-bridge.js was not created."
            exit 1
          fi

          echo "Native bridge created successfully."


      # =========================================================
      # 7. CREATE CAPACITOR CONFIG
      # =========================================================
      - name: Create Capacitor Config
        shell: bash
        run: |
          set -e

          cat > capacitor.config.json <<EOF
          {
            "appId": "${PACKAGE_NAME}",
            "appName": "${APP_NAME}",
            "webDir": "www",
            "bundledWebRuntime": false,

            "plugins": {
              "SplashScreen": {
                "launchShowDuration": 3000,
                "launchAutoHide": true,
                "backgroundColor": "#001a66",
                "androidSplashResourceName": "splash",
                "androidScaleType": "CENTER_CROP",
                "splashFullScreen": true,
                "splashImmersive": true,
                "showSpinner": false
              }
            }
          }
          EOF

          echo "Capacitor config:"
          cat capacitor.config.json


      # =========================================================
      # 8. JAVA 21
      # =========================================================
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "gradle"


      # =========================================================
      # 9. CREATE ANDROID PROJECT
      # =========================================================
      - name: Add Android Platform
        shell: bash
        run: |
          set -e

          npx cap add android


      # =========================================================
      # 10. CONFIGURE ADMOB MANIFEST + NATIVE TEMPLATES
      # =========================================================
      - name: Configure NextGen AdMob Android
        shell: bash
        run: |
          set -e

          echo "Checking AdMob scripts..."

          if [ ! -f node_modules/capacitor-admob-nextgen/scripts/admob-manifest.js ]; then
            echo "ERROR: admob-manifest.js not found."
            exit 1
          fi

          if [ ! -f node_modules/capacitor-admob-nextgen/scripts/admob-native.js ]; then
            echo "ERROR: admob-native.js not found."
            exit 1
          fi

          echo "Running AdMob manifest configuration..."
          node node_modules/capacitor-admob-nextgen/scripts/admob-manifest.js

          echo "Running Native Ads configuration..."
          node node_modules/capacitor-admob-nextgen/scripts/admob-native.js

          echo "AdMob native configuration completed."


      # =========================================================
      # 11. SYNC CAPACITOR
      # =========================================================
      - name: Sync Capacitor Android
        shell: bash
        run: |
          set -e

          npx cap sync android

          echo "Capacitor Android sync completed."


      # =========================================================
      # 12. VERIFY ALL ADMOB PLUGINS
      # =========================================================
      - name: Verify AdMob Plugins
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "VERIFYING ADMOB PLUGINS"
          echo "=========================================="

          echo ""
          echo "1. Capacitor AdMob:"
          test -d node_modules/capacitor-admob-nextgen
          echo "OK"

          echo ""
          echo "2. Core Cordova AdMob NextGen:"
          test -d node_modules/cordova-plugin-admob-nextgen
          echo "OK"

          echo ""
          echo "3. Native Ad Extension:"
          test -d node_modules/cordova-plugin-admob-nextgen-native
          echo "OK"

          echo ""
          echo "Installed versions:"
          npm list \
            capacitor-admob-nextgen \
            cordova-plugin-admob-nextgen \
            cordova-plugin-admob-nextgen-native \
            --depth=0

          echo ""
          echo "Checking Native showWith() API..."

          if grep -R "showWith" \
            node_modules/cordova-plugin-admob-nextgen-native \
            >/dev/null 2>&1; then

            echo "showWith() FOUND"

          else

            echo "ERROR: showWith() was not found."
            exit 1

          fi

          echo ""
          echo "All AdMob plugins verified."


      # =========================================================
      # 13. VERIFY ANDROID ADMOB SDK DEPENDENCIES
      # =========================================================
      - name: Verify Android AdMob Configuration
        shell: bash
        run: |
          set -e

          echo "Searching Android project for AdMob configuration..."

          grep -R \
            "APPLICATION_ID" \
            android/app/src/main \
            2>/dev/null || true

          echo ""
          echo "Searching for NextGen AdMob dependencies..."

          grep -R \
            "admob" \
            android \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            2>/dev/null | head -100 || true


      # =========================================================
      # 14. ANDROID API 36 / MIN SDK 24
      # =========================================================
      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          if [ -f android/variables.gradle ]; then

            sed -i \
              's/targetSdkVersion = .*/targetSdkVersion = 36/' \
              android/variables.gradle || true

            sed -i \
              's/compileSdkVersion = .*/compileSdkVersion = 36/' \
              android/variables.gradle || true

            sed -i \
              's/minSdkVersion = .*/minSdkVersion = 24/' \
              android/variables.gradle || true

          fi

          if [ -f android/app/build.gradle ]; then

            sed -i \
              's/targetSdkVersion .*/targetSdkVersion 36/' \
              android/app/build.gradle || true

            sed -i \
              's/compileSdkVersion .*/compileSdkVersion 36/' \
              android/app/build.gradle || true

            sed -i \
              's/minSdk .*/minSdk 24/' \
              android/app/build.gradle || true

            sed -i \
              's/minSdkVersion .*/minSdkVersion 24/' \
              android/app/build.gradle || true

          fi

          echo "Android SDK configured."


      # =========================================================
      # 15. VERSION CODE
      # =========================================================
      - name: Set Dynamic Version
        shell: bash
        run: |
          set -e

          VERSION_CODE="${{ github.run_number }}"
          VERSION_NAME="1.0.${{ github.run_number }}"

          sed -i \
            "s/versionCode 1/versionCode ${VERSION_CODE}/" \
            android/app/build.gradle || true

          sed -i \
            "s/versionName \"1.0\"/versionName \"${VERSION_NAME}\"/" \
            android/app/build.gradle || true

          echo "Version Code: ${VERSION_CODE}"
          echo "Version Name: ${VERSION_NAME}"


      # =========================================================
      # 16. MAIN ACTIVITY
      # =========================================================
      - name: Configure MainActivity
        shell: bash
        run: |
          set -e

          PACKAGE_PATH=$(echo "${PACKAGE_NAME}" | tr '.' '/')

          mkdir -p \
            "android/app/src/main/java/${PACKAGE_PATH}"

          cat > \
            "android/app/src/main/java/${PACKAGE_PATH}/MainActivity.java" \
            <<EOF
          package ${PACKAGE_NAME};

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              @Override
              public void onBackPressed() {

                  if (
                      this.bridge != null &&
                      this.bridge.getWebView() != null &&
                      this.bridge.getWebView().canGoBack()
                  ) {
                      this.bridge.getWebView().goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

          echo "MainActivity created."


      # =========================================================
      # 17. APP ICON
      # =========================================================
      - name: Setup App Icon
        shell: bash
        run: |
          set -e

          if [ -f s.png ]; then

            echo "Installing s.png as app icon..."

            rm -rf \
              android/app/src/main/res/mipmap-anydpi-v26

            find android/app/src/main/res \
              -name "ic_launcher*.xml" \
              -type f \
              -delete

            for dir in android/app/src/main/res/mipmap-*/; do

              cp -f s.png \
                "${dir}ic_launcher.png" \
                2>/dev/null || true

              cp -f s.png \
                "${dir}ic_launcher_round.png" \
                2>/dev/null || true

            done

            echo "App icon installed."

          else

            echo "s.png not found."
            echo "Using default icon."

          fi


      # =========================================================
      # 18. FINAL CAPACITOR SYNC
      # =========================================================
      - name: Final Capacitor Sync
        shell: bash
        run: |
          set -e

          npx cap sync android


      # =========================================================
      # 19. BUILD DEBUG APK
      # =========================================================
      - name: Build Installable Debug APK
        shell: bash
        run: |
          set -e

          cd android

          chmod +x gradlew

          ./gradlew assembleDebug --no-daemon


      # =========================================================
      # 20. VERIFY APK
      # =========================================================
      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "APK BUILD SUCCESSFUL"
          echo "=========================================="

          ls -lh "$APK_PATH"


      # =========================================================
      # 21. RENAME APK
      # =========================================================
      - name: Rename APK
        shell: bash
        run: |
          set -e

          cp \
            android/app/build/outputs/apk/debug/app-debug.apk \
            fira-tech.apk

          ls -lh fira-tech.apk


      # =========================================================
      # 22. UPLOAD APK
      # =========================================================
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fira-tech-apk
          path: fira-tech.apk
          if-no-files-found: error
