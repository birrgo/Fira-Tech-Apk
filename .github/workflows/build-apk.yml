name: Convert PWA to Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  APP_NAME: "Fira Tech"
  PACKAGE_NAME: "com.firatech.app"
  ADMOB_APP_ID: "ca-app-pub-3940256099942544~3347511713"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Node Dependencies & Esbuild
        run: |
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest @capacitor/splash-screen@latest capacitor-admob-nextgen esbuild

      - name: Configure NextGen Ads & Sync Hooks in package.json
        run: |
          node -e "
          const fs = require('fs');
          let pkg = JSON.parse(fs.readFileSync('package.json'));
          
          pkg.admob = {
            androidAppId: '${{ env.ADMOB_APP_ID }}',
            enableNativeAds: { android: true }
          };
          
          pkg.scripts = pkg.scripts || {};
          pkg.scripts['capacitor:sync:after'] = 'node node_modules/capacitor-admob-nextgen/scripts/admob-manifest.js && node node_modules/capacitor-admob-nextgen/scripts/admob-native.js';
          
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "

      - name: Bundle Web Files & Compile Native Bridge
        run: |
          mkdir www
          rsync -av --exclude='.git' --exclude='.github' --exclude='www' --exclude='node_modules' ./ www/
          
          echo "import { Capacitor } from '@capacitor/core';" > bridge.js
          echo "import { AdMobNextGen } from 'capacitor-admob-nextgen';" >> bridge.js
          echo "window.Capacitor = Capacitor;" >> bridge.js
          echo "window.AdMobPlugin = AdMobNextGen;" >> bridge.js
          
          npx esbuild bridge.js --bundle --minify --outfile=www/native-bridge.js

      - name: Create Capacitor Config
        run: |
          echo '{' > capacitor.config.json
          echo '  "appId": "${{ env.PACKAGE_NAME }}",' >> capacitor.config.json
          echo '  "appName": "${{ env.APP_NAME }}",' >> capacitor.config.json
          echo '  "webDir": "www",' >> capacitor.config.json
          echo '  "plugins": {' >> capacitor.config.json
          echo '    "SplashScreen": {' >> capacitor.config.json
          echo '      "launchShowDuration": 3000,' >> capacitor.config.json
          echo '      "launchAutoHide": true,' >> capacitor.config.json
          echo '      "backgroundColor": "#001a66",' >> capacitor.config.json
          echo '      "androidSplashResourceName": "splash",' >> capacitor.config.json
          echo '      "androidScaleType": "CENTER_CROP",' >> capacitor.config.json
          echo '      "splashFullScreen": true,' >> capacitor.config.json
          echo '      "splashImmersive": true,' >> capacitor.config.json
          echo '      "showSpinner": false' >> capacitor.config.json
          echo '    }' >> capacitor.config.json
          echo '  }' >> capacitor.config.json
          echo '}' >> capacitor.config.json

      - name: Initialize & Sync Android Project
        run: |
          npx cap add android
          npx cap sync android

      - name: Apply Rounded Corners to Native Ads
        run: |
          mkdir -p android/app/src/main/res/layout
          TEMPLATE_PATH=$(find android/app/src/main/res/layout -name "*admob*native*.xml" | head -n 1)
          
          if [ -n "$TEMPLATE_PATH" ]; then
            INNER_XML=$(cat "$TEMPLATE_PATH")
            cat << EOF > "$TEMPLATE_PATH"
          <?xml version="1.0" encoding="utf-8"?>
          <androidx.cardview.widget.CardView
              xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              app:cardCornerRadius="12dp"
              app:cardElevation="0dp"
              app:cardBackgroundColor="@android:color/transparent">
              
              $INNER_XML
              
          </androidx.cardview.widget.CardView>
          EOF
          fi

      - name: Target API Level 35 and MinSdk 26
        run: |
          if [ -f android/variables.gradle ]; then
            sed -i 's/targetSdkVersion = .*/targetSdkVersion = 35/' android/variables.gradle
            sed -i 's/compileSdkVersion = .*/compileSdkVersion = 35/' android/variables.gradle
            sed -i 's/minSdkVersion = .*/minSdkVersion = 26/' android/variables.gradle
          fi
          sed -i 's/targetSdkVersion .*/targetSdkVersion 35/' android/app/build.gradle
          sed -i 's/compileSdkVersion .*/compileSdkVersion 35/' android/app/build.gradle
          sed -i 's/minSdk .*/minSdk 26/' android/app/build.gradle
          sed -i 's/minSdkVersion .*/minSdkVersion 26/' android/app/build.gradle

      - name: Set Dynamic Version Code
        run: |
          sed -i 's/versionCode 1/versionCode ${{ github.run_number }}/' android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "1.0.${{ github.run_number }}"/' android/app/build.gradle

      - name: Fix Android Hardware Back Button
        run: |
          PACKAGE_PATH=$(echo "${{ env.PACKAGE_NAME }}" | tr '.' '/')
          mkdir -p android/app/src/main/java/$PACKAGE_PATH
          
          cat << EOF > android/app/src/main/java/$PACKAGE_PATH/MainActivity.java
          package ${{ env.PACKAGE_NAME }};

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onBackPressed() {
                  if (this.bridge != null && this.bridge.getWebView() != null && this.bridge.getWebView().canGoBack()) {
                      this.bridge.getWebView().goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Setup App Icon
        run: |
          if [ -f s.png ]; then
            rm -rf android/app/src/main/res/mipmap-anydpi-v26
            find android/app/src/main/res -name "ic_launcher*.xml" -type f -delete
            for dir in android/app/src/main/res/mipmap-*/; do
              cp -f s.png "${dir}ic_launcher.png" 2>/dev/null || true
              cp -f s.png "${dir}ic_launcher_round.png" 2>/dev/null || true
            done
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Build Installable Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Move & Rename APK Output
        run: mv android/app/build/outputs/apk/debug/app-debug.apk fira-tech.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fira-tech-apk
          path: fira-tech.apk
